<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vote Successful - FairVote</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 45px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .success {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #16a34a;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success">
        ✓
    </div>

    <h1>Vote Cast Successfully!</h1>

    <p>
        Your vote has been recorded successfully.
    </p>

    <p>
        Thank you for participating in the election.
    </p>

    <a href="{{ url_for('dashboard') }}" class="btn">
        Back to Dashboard
    </a>

</div>

</body>
</html>
